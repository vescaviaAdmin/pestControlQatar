<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Page not found for Al Safa Hygiene."
    />
    <title>Page Not Found | Al Safa Hygiene</title>
    <link rel="icon" href="public/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .not-found-shell {
        display: grid;
        width: min(720px, calc(100vw - 32px));
        min-height: 100vh;
        place-items: center;
        margin: 0 auto;
        padding: 120px 0 72px;
      }

      .not-found-card {
        width: 100%;
        padding: 40px;
        border: 1px solid rgba(5, 34, 83, 0.08);
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 24px 60px rgba(5, 34, 83, 0.08);
        text-align: center;
      }

      .not-found-card h1 {
        margin: 0 0 16px;
        color: #052253;
        font-size: clamp(36px, 6vw, 56px);
        line-height: 1.1;
      }

      .not-found-card p {
        max-width: 540px;
        margin: 0 auto 28px;
        color: #697a98;
        font-size: 18px;
        line-height: 1.5;
      }

      .not-found-card .button {
        width: 220px;
        height: 48px;
      }
    </style>
  </head>
  <body>
    <main class="homepage">
      <div class="figma-frame">
        <section class="not-found-shell" aria-labelledby="not-found-title">
          <article class="not-found-card">
            <h1 id="not-found-title">Page not found</h1>
            <p>
              The page you requested is not available. Return to the Al Safa
              Hygiene homepage to continue browsing services.
            </p>
            <a class="button button-primary" href="index.html">Back to home</a>
          </article>
        </section>
      </div>
    </main>
  </body>
</html>
